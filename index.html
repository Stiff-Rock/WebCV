<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV - Yago Pernas</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link href="css/a4-page.css" rel="stylesheet">
  <link id="specific-css" href="css/cool-cv.css" rel="stylesheet">
  <script src="js/index.js"></script>
</head>

<body>
  <section id="settings">
    <label for="CV">Tipo</label>
    <select id="type-combobox" name="CV">
      <option value="cool">Tech</option>
      <option value="pro">Pro</option>
    </select>

    <span style="color: white;">|</span>

    <label for="Idioma">Idioma</label>
    <select id="lenguage-combobox" name="Idioma">
      <option value="es">Español</option>
      <option value="en">English</option>
    </select>

    <span style="color: white;">|</span>

    <input type="checkbox" checked id="portfolio-chckbx" name="portfolio-chckbx">
    <label for="portfolio-chckbx">Incluir link del Portfolio</label>

    <span style="color: white;">|</span>

    <button name="print" id="print-btn"> &nbsp;Imprimir</button>
  </section>

  <div class="a4-page">
    <div id="cv-container">
    </div>
  </div>
</body>

</html>
